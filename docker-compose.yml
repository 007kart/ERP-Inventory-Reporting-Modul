services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - '5442:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d stockpilot']
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - inventory_pg:/var/lib/postgresql/data
volumes:
  inventory_pg:
